---
layout: default
---
<header class="hero d-flex align-items-center text-white text-center">
  <div class="container py-5">
    <p class="text-uppercase small fw-bold mb-2">Blog</p>
    <h1 class="display-5 fw-bold">{{ page.title }}</h1>
    <p class="lead mx-auto" style="max-width: 820px;">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.author %} · {{ page.author }}{% endif %}
    </p>
  </div>
</header>
<main class="py-5">
  <article class="container" style="max-width: 860px;">
    <div class="lead mb-4">{{ page.description }}</div>
    <div class="post-content">
      {{ content }}
    </div>
    <hr class="my-5">
    <p><a href="{{ '/blog/' | relative_url }}">← Back to the blog</a></p>
  </article>
</main>
